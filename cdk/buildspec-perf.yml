version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - curl -fsSL --retry 3 --retry-connrefused --connect-timeout 15 --max-time 300 -o k6.tar.gz https://github.com/grafana/k6/releases/download/v0.55.0/k6-v0.55.0-linux-amd64.tar.gz
      - tar xzf k6.tar.gz
      - mv k6-v0.55.0-linux-amd64/k6 /usr/local/bin
      - k6 version

  pre_build:
    commands:
      - echo "Setting up performance tests"
      - rm -rf performance/dist
      - set +x && eval "$(node performance/scripts/resolve-credentials.mjs)" > /dev/null 2>&1 && set -x
      - echo "AWS credentials resolved"

  build:
    commands:
      - echo "Running Performance tests"
      - npm --prefix performance run "${PERF_TARGET:-smoke}"
      - echo "Performance tests completed"

  post_build:
    commands:
      - chmod +x performance/scripts/publish-metrics.sh
      - performance/scripts/publish-metrics.sh

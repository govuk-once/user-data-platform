# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key

  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json

  # Terraform security and linting
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.104.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_checkov
        args:
          - --args=--quiet
          - --args=--compact
          - --args=--skip-check=CKV_AWS_338,CKV_AWS_158,CKV_AWS_26,CKV_AWS_50,CKV_AWS_117,CKV_AWS_116,CKV_AWS_272,CKV_AWS_115

  - repo: local
    hooks:
      # Prettier formatting
      - id: prettier
        name: Prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown]
        exclude: ^(node_modules/|dist/|build/|coverage/|\.nx/|pnpm-lock\.yaml)

      # ESLint - use local config
      - id: eslint
        name: ESLint
        entry: bash -c 'pnpm --filter=user-data-platform exec eslint --fix "$@"' --
        language: system
        types: [file]
        files: \.(ts|tsx|js|jsx)$
        exclude: ^(node_modules/|dist/|build/|coverage/|\.nx/)
        pass_filenames: true

      # TypeScript type checking
      - id: typescript-check
        name: TypeScript Check
        entry: pnpm exec tsc --noEmit
        language: system
        types: [ts, tsx]
        pass_filenames: false
        exclude: ^(node_modules/|dist/|build/|coverage/|\.nx/)

      # Run all unit tests
      - id: test-all
        name: Run Unit Tests
        entry: pnpm exec vitest run
        language: system
        pass_filenames: false
        stages: [pre-push]

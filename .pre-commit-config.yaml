# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key

  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: pnpm-lock.yaml

  - repo: local
    hooks:
      # Prettier formatting
      - id: format_check
        name: Format Check
        entry: pnpm format:write
        language: system
        pass_filenames: false
        stages:
          - 'pre-commit'

      - id: linting_check
        name: Linting Check
        entry: pnpm lint:affected
        language: system
        pass_filenames: false
        stages:
          - 'pre-commit'

      # TypeScript type checking
      - id: typescript_check
        name: TypeScript Check
        entry: pnpm exec tsc --noEmit
        language: system
        types: [ts, tsx]
        pass_filenames: false
        exclude: ^(node_modules/|dist/|build/|coverage/|\.nx/)

      # Run all unit tests
      - id: test-all
        name: Run Unit Tests
        entry: pnpm exec vitest run
        language: system
        pass_filenames: false
        stages: [pre-push]

  - repo: https://github.com/semgrep/semgrep
    rev: v1.89.0
    hooks:
      - id: semgrep
        name: semgrep
        entry: bash -c 'semgrep scan $(cat .semgrep-args.txt) --error "$@"' --
        language: system
        pass_filenames: true
        verbose: false

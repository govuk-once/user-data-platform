# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# Fail fast to speed up pre-commit and encourage continued
# resolving issues as they appear
fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key

  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          [
            '--baseline',
            '.secrets.baseline',
            '--exclude-files',
            'pnpm-lock.yaml',
            '--exclude-files',
            'migrations.json',
            '--exclude-files',
            'docs/index.html',
            '--exclude-files',
            'e2e/src/features/sar.feature',
          ]

  - repo: local
    hooks:
      # Generate OpenAPI docs (from git-hooks/pre-commit)
      - id: generate-openapi
        name: Generate OpenAPI Docs
        entry: bash git-hooks/pre-commit
        language: system
        pass_filenames: false
        stages:
          - 'pre-commit'

      # Prettier formatting
      - id: format-check
        name: Format Check
        entry: pnpm format:write
        language: system
        pass_filenames: false
        stages:
          - 'pre-commit'

      - id: linting-check
        name: Linting Check
        entry: pnpm lint:affected
        language: system
        pass_filenames: false
        stages:
          - 'pre-commit'

      # TypeScript type checking
      - id: typescript-check
        name: TypeScript Check
        entry: pnpm exec tsc --noEmit
        language: system
        types: [ts, tsx]
        pass_filenames: false
        exclude: ^(node_modules/|dist/|build/|coverage/|\.nx/)

      # Checkov security scanning
      - id: checkov-scan
        name: Checkov Scan
        entry: checkov -d cdk --config-file cdk/.checkov.yaml
        language: system
        pass_filenames: false
        args:
          - --skip-check=CKV_AWS_116

      # Run all unit tests
      - id: test-all
        name: Run Unit Tests
        entry: pnpm exec vitest run
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Validate conventional commits (from git-hooks/commit-msg)
      - id: commit-msg-validation
        name: Validate Conventional Commit Format
        entry: bash git-hooks/commit-msg
        language: system
        stages: [commit-msg]

  - repo: https://github.com/semgrep/semgrep
    rev: v1.89.0
    hooks:
      - id: semgrep
        name: semgrep
        entry: bash -c 'semgrep scan $(cat .semgrep-args.txt) --error "$@"' --
        language: system
        pass_filenames: true
        verbose: false

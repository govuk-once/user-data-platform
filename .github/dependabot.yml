version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    allow:
      - dependency-type: direct
    groups:
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
          - '@aws-lambda-powertools/*'
          - '@aws-crypto/*'
          - '@smithy/*'
          - 'aws-sdk-client-mock*'
      aws-cdk:
        patterns:
          - aws-cdk
          - aws-cdk-lib
          - cdk-nag
          - constructs
      nx:
        patterns:
          - nx
          - '@nx/*'
      production:
        dependency-type: production
      development:
        dependency-type: development

name: ZAP Full Security Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to scan'
        required: false
        default: 'https://staging.udp.once.service.gov.uk'
  schedule:
    - cron: '0 3 * * 0' # Weekly Sunday 3am UTC

env:
  DEFAULT_TARGET: 'https://staging.udp.once.service.gov.uk'

jobs:
  zap-scan:
    name: OWASP ZAP Full Scan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
      actions: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set target URL
        id: target
        run: |
          if [ -n "$TARGET_INPUT" ]; then
            echo "url=$TARGET_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "url=$DEFAULT_TARGET" >> "$GITHUB_OUTPUT"
          fi
        env:
          TARGET_INPUT: ${{ inputs.target_url }}

      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: ${{ steps.target.outputs.url }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: >-
            -z "-config replacer.full_list(0).description=auth
            -config replacer.full_list(0).enabled=true
            -config replacer.full_list(0).matchtype=REQ_HEADER
            -config replacer.full_list(0).matchstr=Authorization
            -config replacer.full_list(0).replacement=Bearer\ ${AUTH_TOKEN}"
          fail_action: 'warn'
          allow_issue_writing: true
          issue_title: 'ZAP Full Scan Report - UDP'
          artifact_name: 'zap-full-scan-report'
        env:
          AUTH_TOKEN: ${{ secrets.UDP_ZAP_AUTH_TOKEN }}

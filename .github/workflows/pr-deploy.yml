name: PR Deploy & Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  AWS_REGION: eu-west-2
  NODE_VERSION: '20'
  DEVELOPER_ID: pr-${{ github.event.pull_request.number }}
  GITHUB_OWNER: ${{ github.repository_owner }}
  GITHUB_REPO: ${{ github.event.repository.name }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Deploy PR Environment
    runs-on: ubuntu-latest
    outputs:
      codebuild-project: ${{ steps.get-outputs.outputs.codebuild-project }}
      source-bucket: ${{ steps.get-outputs.outputs.source-bucket }}
      source-path: ${{ steps.get-outputs.outputs.source-path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_DEPLOYMENT_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CDK stack
        run: npx nx run cdk:deploy:dev

      - name: Get Stack outputs
        id: get-outputs
        uses: ./.github/actions/get-stack-outputs
        with:
          stack-name: ${{ env.DEVELOPER_ID }}-dev-e2e
          aws-region: ${{ env.AWS_REGION }}

  e2e-tests:
    name: Run E2E Tests
    needs: deploy
    uses: ./.github/workflows/e2e-tests.yml
    secrets:
      aws-role: ${{ secrets.DEV_DEPLOYMENT_ROLE }}
    with:
      codebuild-project: ${{ needs.deploy.outputs.codebuild-project }}
      source-bucket: ${{ needs.deploy.outputs.source-bucket }}
      source-path: ${{ needs.deploy.opts.source-path }}
      aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      node-version: ${{ vars.NODE_VERSION || '20' }}

  post-results:
    name: Post Test Results to PR
    needs: [deploy, e2e-tests]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Post test results to PR
        uses: actions/github-script@v7
        with:
          script: |
            const buildId = '${{ needs.e2e-tests.outputs.build-id }}';
            const status = '${{ needs.e2e-tests.result }}';
            const region = '${{ env.AWS_REGION }}';
            const project = '${{ needs.deploy.outputs.codebuild-project }}';

            const emoji = status === 'success' ? '✅' : '❌';
            const logsUrl = `https://${region}.console.aws.amazon.com/codesuite/codebuild/projects/${project}/build/${buildId}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## E2E Test Results ${emoji}\n\n**Status:** ${status}\n**Build ID:** \`${buildId}\`\n\n[View Build Logs](${logsUrl})`
            });

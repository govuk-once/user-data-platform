name: PR Deploy & Tests

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  validate-pr:
    name: Validate PR
    uses: ./.github/workflows/__validate-pr.yml

  deploy:
    name: Deploy PR Environment
    needs: validate-pr
    uses: ./.github/workflows/__deploy-env.yml
    with:
      stack-prefix: pr-${{ github.event.pull_request.number }}-dev
      developer-id: pr-${{ github.event.pull_request.number }}
      nx-target: cdk:deploy:dev
      ref: ${{ github.sha }}
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.DEV_DEPLOYMENT_ROLE }}

  e2e-tests:
    name: Run E2E Tests
    needs: deploy
    uses: ./.github/workflows/__e2e.yml
    with:
      codebuild-project: ${{ needs.deploy.outputs.codebuild-project }}
      source-bucket: ${{ needs.deploy.outputs.source-bucket }}
      source-path: ${{ needs.deploy.outputs.source-path }}
      e2e-target: pr
      post-pr-comment: true
      ref: ${{ github.sha }}
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.DEV_DEPLOYMENT_ROLE }}

  perf-test:
    name: Performance Tests
    needs: deploy
    uses: ./.github/workflows/__perf-test.yml
    with:
      environment: dev
      stack-prefix: pr-${{ github.event.pull_request.number }}-dev
      perf-target: smoke
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.DEV_DEPLOYMENT_ROLE }}

name: PR Deploy & Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  AWS_REGION: eu-west-2
  NODE_VERSION: '20'
  DEVELOPER_ID: pr-${{ github.event.pull_request.number }}
  GITHUB_OWNER: ${{ github.repository_owner }}
  GITHUB_REPO: ${{ github.event.repository.name }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Deploy PR Environment
    runs-on: ubuntu-latest
    outputs:
      codebuild-project: ${{ steps.get-outputs.outputs.codebuild-project }}
      source-bucket: ${{ steps.get-outputs.outputs.source-bucket }}
      source-path: ${{ steps.get-outputs.outputs.source-path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        run: |
          npm install -g pnpm@latest-10
          pnpm install

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@56d6a583f00f6bad6d19d91d53a7bc3b8143d0e9 # v5.1.1
        with:
          role-to-assume: ${{ secrets.DEV_DEPLOYMENT_ROLE }}
          aws-region: eu-west-2

      - name: Deploy CDK stack
        run: |
          export CDK_DEFAULT_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          export CDK_DEFAULT_REGION=${{ env.AWS_REGION }}
          npx nx run cdk:deploy:dev

      - name: Get Stack outputs
        id: get-outputs
        working-directory: cdk
        run: |
          CODEBUILD_PROJECT=$(aws cloudformation describe-stacks --stack-name ${{ env.DEVELOPER_ID }}-dev-e2e --query "Stacks[0].Outputs[?OutputKey=='CodeBuildProjectName'].OutputValue" --output text)
          echo "codebuild-project=${CODEBUILD_PROJECT}" >> $GITHUB_OUTPUT
          echo "CodeBuild project: ${CODEBUILD_PROJECT}"
          SOURCE_BUCKET=$(aws cloudformation describe-stacks --stack-name ${{ env.DEVELOPER_ID }}-dev-e2e --query "Stacks[0].Outputs[?OutputKey=='SourceBucketName'].OutputValue" --output text)
          echo "source-bucket=${SOURCE_BUCKET}" >> $GITHUB_OUTPUT
          echo "source bucket: ${SOURCE_BUCKET}"
          SOURCE_PATH=$(aws cloudformation describe-stacks --stack-name ${{ env.DEVELOPER_ID }}-dev-e2e --query "Stacks[0].Outputs[?OutputKey=='SourcePath'].OutputValue" --output text)
          echo "source-path=${SOURCE_PATH}" >> $GITHUB_OUTPUT
          echo "source path: ${SOURCE_PATH}"

  e2e-tests:
    name: Run E2e Tests
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9 --activate

      - name: Install Dependencies
        run: |
          rm pnpm-lock.yaml
          pnpm install

      - name: Configure Aws Credentials
        uses: aws-actions/configure-aws-credentials@56d6a583f00f6bad6d19d91d53a7bc3b8143d0e9 # v5.1.1
        with:
          role-to-assume: ${{ secrets.DEV_DEPLOYMENT_ROLE }}
          aws-region: eu-west-2

      - name: Upload source to S3
        run: |
          echo "UPLOADING source to s3 get store path"
          STORE_PATH=$(pnpm store path)
          pnpm store prune

          mkdir -p .pnpm-store
          cp -r "${STORE_PATH}"/* .pnpm-store/

          echo "UPLOADING source to s3 for e2e"
          zip -rqy source.zip . -x '.git/*' -x ',.nx/*' -x "cdk/cdk.out/*"
          aws s3 cp source.zip "s3://${{ needs.deploy.outputs.source-bucket }}/${{ needs.deploy.outputs.source-path }}"

      - name: Trigger Codebuild and wait for completion
        id: codebuild
        run: |
          echo "Starting Codebuild project: ${{ needs.deploy.outputs.codebuild-project }}"

          # Start Build
          BUILD_ID=$(aws codebuild start-build --project-name "${{ needs.deploy.outputs.codebuild-project }}" --query 'build.id' --output text)

          echo "Build started ${BUILD_ID}"
          echo "build-id=${BUILD_ID}" >> $GITHUB_OUTPUT

          # poll for completion
          while true; do
            BUILD_STATUS=$(aws codebuild batch-get-builds --ids "${BUILD_ID}" --query 'builds[0].buildStatus' --output text)
            CURRENT_PHASE=$(aws codebuild batch-get-builds --ids "${BUILD_ID}" --query 'builds[0].currentPhase' --output text)

            echo "Build status: ${BUILD_STATUS}, phase: ${CURRENT_PHASE}"

            case "${BUILD_STATUS}" in
              SUCCEEDED)
                echo "E2E tests passed!"
                exit 0
                ;;
              FAILED|FAULT|STOPPED|TIMED_OUT)
                echo "E2E tests failed with status &{BUILD_STATUS}"

                # get build logs
                BUILD_ARN=$(aws codebuild batch-get-builds --ids "${Build_ID}" --query 'builds[0].arn' --output text)
                echo "Build logs: https://${AWS_REGION}.console.aws.amazon.com/codesuite/codebuild/projects/${{ needs.deploy.outputs.codebuild-project }}/build/${BUILD_ID}"

                exit 1
                ;;
              IN_PROGRESS)
                sleep 30
                ;;
              *)
                echo "unknown status: ${BUILD_STATUS}"
                sleep 30
                ;;
            esac
          done

      - name: Post test results to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const buildid = `${{ steps.codebuild.outputs.build-id }}`;
            const status = `${{ job.status }}`;
            const region = `${{ env.AWS_REGION }}`;
            const project = `${{ needs.deploy.outputs.codebuild-project }}`;

            const emoji = status == 'success' ? '' : '';
            const logsUrl = "http://${region}.console.aws.amazon.com/codesuite/codebuild/projects/${project}/build/${buildid}"

            await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## E2E tests results ${emoji}\n\n**status:** ${status}\n**BUILD ID** \`${buildid}\``
            })

name: Performance Tests

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        type: string
      aws-region:
        description: 'Region in aws'
        required: false
        type: string
        default: 'eu-west-2'
      stack-prefix:
        description: 'CFN stack prefix (eg dev, pr-123-dev)'
        required: true
        type: string
      perf-target:
        description: 'Performance target for test run'
        required: false
        type: string
        default: 'smoke'
      node-version:
        required: false
        type: string
        default: '24'
    secrets:
      DEPLOYMENT_ROLE:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  perf-test:
    name: Performance tests (${{ inputs.environment }})
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          persist-credentials: false

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ inputs.node-version }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@56d6a583f00f6bad6d19d91d53a7bc3b8143d0e9 # v5.1.1
        with:
          role-to-assume: ${{ secrets.DEPLOYMENT_ROLE }}
          aws-region: ${{ inputs.aws-region }}

      - name: Get Perf CodeBuild project name
        id: get-perf-project
        env:
          STACK_NAME: ${{ inputs.stack-prefix }}-perf
        run: |
          PERF_PROJECT=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs[?OutputKey=='PerfCodeBuildProjectName'].OutputValue" --output text)
          echo "perf-project=${PERF_PROJECT}" >> "$GITHUB_OUTPUT"
          echo "Perf CodeBuild project: ${PERF_PROJECT}"

      - name: Get source bucket and path
        id: get-source
        uses: ./.github/actions/e2e-stack-outputs
        with:
          stack-name: ${{ inputs.stack-prefix }}-e2e

      - name: Upload source to S3
        uses: ./.github/actions/upload-source
        with:
          bucket: ${{ steps.get-source.outputs.source-bucket }}
          path: ${{ steps.get-source.outputs.source-path }}

      - name: Start performance tests (fire-and-forget)
        uses: ./.github/actions/run-codebuild
        with:
          project: ${{ steps.get-perf-project.outputs.perf-project }}
          env-overrides: name=PERF_TARGET,value=${{ inputs.perf-target }},type=PLAINTEXT
          wait: 'false'
          aws-region: ${{ inputs.aws-region }}

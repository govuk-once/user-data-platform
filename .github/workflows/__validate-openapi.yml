on:
  workflow_call:

jobs:
  openapi:
    name: Check for breaking changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change-accepted') }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install oasdiff
        env:
          OASDIFF_VERSION: 1.11.10
          # sha256 of oasdiff_1.11.10_linux_amd64.tar.gz - verify when bumping:
          # https://github.com/oasdiff/oasdiff/releases
          OASDIFF_SHA256: 6d5880efb3422401f14c85f3c1347d6c41de3e4ea7c04e3ca7dc5c8f452e8ba2 # pragma: allowlist secret
        run: |
          curl -fsSL -o oasdiff.tar.gz \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  oasdiff.tar.gz" | sha256sum -c -
          tar -xzf oasdiff.tar.gz oasdiff
          mkdir -p "$HOME/.local/bin"
          install -m 0755 oasdiff "$HOME/.local/bin/oasdiff"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm -f oasdiff oasdiff.tar.gz
          "$HOME/.local/bin/oasdiff" --version

      - name: Check for breaking changes
        run: |
          if ! git show origin/main:docs/openapi.yml > /tmp/openapi-latest.yml 2>/dev/null; then
            echo "No docs/openapi.yml found on main, skipping check."
            exit 0
          fi

          BREAKING=$(oasdiff breaking /tmp/openapi-latest.yml docs/openapi.yml --format json || true)

          if [ -z "$BREAKING" ]; then
            echo "✅ No breaking changes detected."
            exit 0
          fi

          ERRORS=$(echo "$BREAKING" | jq '[.[] | select(.level >= 3)]')
          COUNT=$(echo "$ERRORS" | jq 'length')

          if [ "$COUNT" -eq 0 ]; then
            echo "✅ No breaking changes detected."
            exit 0
          fi

          echo "Breaking changes found:"
          echo "$ERRORS" | jq -r \
            '.[] | "  - `\(.id)`\(if .operation then " (\(.operation)\(if .path then " \(.path)" else "" end))" else "" end): \(.text)"'

          if [ "$OVERRIDE" = "true" ]; then
            echo ""
            echo "⚠️ Breaking changes were accepted via the 'breaking-change-accepted' label."
            exit 0
          fi

          exit 1

name: Backup Restore

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      resource_type:
        description: 'Resource type to restore'
        required: true
        type: choice
        options:
          - dynamodb
          - s3
      mode:
        description: 'Restore mode (dynamodb: pitr or backup, s3: backup or list-recovery-points)'
        required: true
        type: choice
        options:
          - pitr
          - backup
          - list-recovery-points
      resource_name:
        description: 'Resource to restore (dynamodb: udp-data / udp-identity, s3: govuk-udpsar-bucket)'
        required: true
        type: choice
        options:
          - udp-data
          - udp-identity
          - govuk-udpsar-bucket
      restore_time:
        description: 'PITR: ISO-8601 restore time (e.g. 2026-04-07T10:00:00Z)'
        required: false
        type: string
      recovery_point_arn:
        description: 'Backup: Recovery point ARN from AWS Backup vault'
        required: false
        type: string
      new_bucket_name:
        description: 'S3 only: Restore to a new bucket name (leave empty to restore in-place)'
        required: false
        type: string
      swap:
        description: 'DynamoDB only: Print swap instructions after restore'
        required: false
        type: boolean
        default: false

env:
  AWS_REGION: eu-west-2
  NODE_VERSION: '22'

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    outputs:
      full-resource-name: ${{ steps.resolve.outputs.full-resource-name }}
      vault-name: ${{ steps.resolve.outputs.vault-name }}
    steps:
      - name: Validate DynamoDB + PITR inputs
        if: inputs.resource_type == 'dynamodb' && inputs.mode == 'pitr' && inputs.restore_time == ''
        run: |
          echo "Error: restore_time is required for DynamoDB PITR mode"
          exit 1

      - name: Validate backup inputs
        if: inputs.mode == 'backup' && inputs.recovery_point_arn == ''
        run: |
          echo "Error: recovery_point_arn is required for backup mode"
          exit 1

      - name: Validate S3 + PITR not allowed
        if: inputs.resource_type == 's3' && inputs.mode == 'pitr'
        run: |
          echo "Error: PITR mode is not supported for S3. Use 'backup' or 'list-recovery-points'."
          exit 1

      - name: Validate DynamoDB + list-recovery-points not allowed
        if: inputs.resource_type == 'dynamodb' && inputs.mode == 'list-recovery-points'
        run: |
          echo "Error: list-recovery-points mode is only supported for S3."
          exit 1

      - name: Resolve environment-specific values
        id: resolve
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          RESOURCE_NAME: ${{ inputs.resource_name }}
        run: |
          if [[ "$ENVIRONMENT" == "staging" ]]; then
            ENV_SUFFIX="stag"
          else
            ENV_SUFFIX="prod"
          fi

          echo "full-resource-name=${RESOURCE_NAME}-${ENV_SUFFIX}" >> $GITHUB_OUTPUT
          echo "vault-name=${ENV_SUFFIX}-backup-vault" >> $GITHUB_OUTPUT

  restore:
    name: Restore ${{ needs.validate.outputs.full-resource-name }} (${{ inputs.mode }})
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        run: |
          npm install -g pnpm
          pnpm install

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f #v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@56d6a583f00f6bad6d19d91d53a7bc3b8143d0e9 # v5.1.1
        with:
          role-to-assume: ${{ inputs.environment == 'staging' && secrets.STAGING_DEPLOYMENT_ROLE || secrets.PRODUCTION_DEPLOYMENT_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # ── DynamoDB Restores ──────────────────────────────────────────────

      - name: DynamoDB PITR restore
        if: inputs.resource_type == 'dynamodb' && inputs.mode == 'pitr'
        run: |
          npx tsx scripts/dynamodb-restore.ts \
            --mode pitr \
            --table "${{ needs.validate.outputs.full-resource-name }}" \
            --restore-time "${{ inputs.restore_time }}" \
            --region "${{ env.AWS_REGION }}" \
            ${{ inputs.swap && '--swap' || '' }}

      - name: DynamoDB backup restore
        if: inputs.resource_type == 'dynamodb' && inputs.mode == 'backup'
        env:
          TABLE_NAME: ${{ needs.validate.outputs.full-resource-name }}
          RECOVERY_POINT_ARN: ${{ inputs.recovery_point_arn }}]
          VAULT_NAME: ${{ needs.validate.outputs.vault-name }}
        run: |
          npx tsx scripts/dynamodb-restore.ts \
            --mode backup \
            --table "$TABLE_NAME" \
            --recovery-point-arn "$RECOVERY_POINT_ARN" \
            --vault "$VAULT_NAME" \
            --region "$AWS_REGION" \
            ${{ inputs.swap && '--swap' || '' }}

      # ── S3 Restores ───────────────────────────────────────────────────

      - name: S3 list recovery points
        if: inputs.resource_type == 's3' && inputs.mode == 'list-recovery-points'
        env:
          BUCKET_NAME: ${{ needs.validate.outputs.full-resource-name }}
          VAULT_NAME: ${{ needs.validate.outputs.vault-name }}
        run: |
          npx tsx scripts/s3-restore.ts \
            --mode list-recovery-points \
            --bucket "$BUCKET_NAME" \
            --vault "$VAULT_NAME" \
            --region "$AWS_REGION"

      - name: S3 backup restore
        if: inputs.resource_type == 's3' && inputs.mode == 'backup'
        env:
          BUCKET_NAME: ${{ needs.validate.outputs.full-resource-name }}
          RECOVERY_POINT_ARN: ${{ inputs.recovery_point_arn }}
          VAULT_NAME: ${{ needs.validate.outputs.vault-name }}
          NEW_BUCKET_NAME: ${{ inputs.new_bucket_name }}
        run: |
          args-(
            --mode backup
            --bucket "$BUCKET_NAME"
            --recovery-point-arn "$RECOVERY_POINT_ARN"
            --vault "$VAULT_NAME"
            --region "$AWS_REGION"
          )
          if [-n "$NEW_BUCKET_NAME"]; then
            args+=(--new-bucket "$NEW_BUCKET_NAME")
          fi
          npx tsx scripts/s3-restore.ts "${args[0]}"

      # ── Summary ────────────────────────────────────────────────────────

      - name: Summary
        if: always()
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          RESOURCE_TYPE: ${{ inputs.resource_type }}
          MODE: ${{ inputs.mode }}
          FULL_RESOURCE_NAME: ${{ needs.validate.outputs.full-resource-name }}
          RESOURCE_TIME: ${{ inputs.restore_time }}
          RECOVERY_POINT_ARN: ${{ inputs.recovery_point_arn }}
          VAULT_NAME: ${{ needs.validate.outputs.vault-name }}
        run: |
          echo "## Restore Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | \`${ENVIRONMENT}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Resource type | \`${RESOURCE_TYPE}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | \`${MODE}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | \`${FULL_RESOURCE_NAME}\` |" >> $GITHUB_STEP_SUMMARY
          if [[ "${MODE}" == "pitr" ]]; then
            echo "| Restore time | \`${RESOURCE_TIME}\` |" >> $GITHUB_STEP_SUMMARY
          elif [[ "${MODE}" == "backup" ]]; then
            echo "| Recovery point | \`${RECOVERY_POINT_ARN}\` |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Vault | \`${VAULT_NAME}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Region | \`${AWS_REGION}\` |" >> $GITHUB_STEP_SUMMARY

name: Deploy Environment

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub environment name (e.g. dev, staging). Leave empty to skip environment protection.'
        required: false
        type: string
        default: ''
      stack-prefix:
        description: 'CFN stack prefix (e.g. dev, stag, pr-123-dev)'
        required: true
        type: string
      nx-target:
        description: 'nx target to invoke (e.g. cdk:deploy:dev)'
        required: true
        type: string
      version:
        description: 'Base semver to write into package.json (e.g. 1.2.4). Leave empty to keep the committed version.'
        required: false
        type: string
        default: ''
      prerelease-tag:
        description: 'If set, package.json version becomes <version>-<prerelease-tag>.<shortSha>'
        required: false
        type: string
        default: ''
      developer-id:
        description: 'DEVELOPER_ID for isolated stacks (e.g. pr-123). Leave empty for shared environments.'
        required: false
        type: string
        default: ''
      ref:
        description: 'Git ref to deploy. Defaults to github.ref_name.'
        required: false
        type: string
        default: ''
      aws-region:
        required: false
        type: string
        default: 'eu-west-2'
      node-version:
        required: false
        type: string
        default: '24'
      expose-outputs:
        description: 'Whether to fetch e2e stack outputs (set false when no e2e stack exists, e.g. prod).'
        required: false
        type: boolean
        default: true
    outputs:
      codebuild-project:
        value: ${{ jobs.deploy.outputs.codebuild-project }}
      source-bucket:
        value: ${{ jobs.deploy.outputs.source-bucket }}
      source-path:
        value: ${{ jobs.deploy.outputs.source-path }}
    secrets:
      DEPLOYMENT_ROLE:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || inputs.stack-prefix }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      codebuild-project: ${{ steps.get-outputs.outputs.codebuild-project }}
      source-bucket: ${{ steps.get-outputs.outputs.source-bucket }}
      source-path: ${{ steps.get-outputs.outputs.source-path }}

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ inputs.node-version }}

      - name: Configure AWS Credentials
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@56d6a583f00f6bad6d19d91d53a7bc3b8143d0e9 # v5.1.1
        with:
          role-to-assume: ${{ secrets.DEPLOYMENT_ROLE }}
          aws-region: ${{ inputs.aws-region }}
          output-credentials: true

      - name: Set package version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE_TAG: ${{ inputs.prerelease-tag }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "${PRERELEASE_TAG}" ]; then
            FINAL_VERSION="${VERSION}-${PRERELEASE_TAG}.${SHA:0:7}"
          else
            FINAL_VERSION="${VERSION}"
          fi
          echo "Set local package.json version to ${FINAL_VERSION}"
          npm version "${FINAL_VERSION}" --no-git-tag-version

      - name: Deploy CDK stack
        env:
          CDK_DEPLOYMENT_ROLE_ARN: ${{ steps.aws-creds.outputs.authenticated-arn }}
          DEVELOPER_ID: ${{ inputs.developer-id }}
          NX_TARGET: ${{ inputs.nx-target }}
        run: npx nx run "${NX_TARGET}"

      - name: Get Stack outputs
        id: get-outputs
        if: inputs.expose-outputs
        uses: ./.github/actions/e2e-stack-outputs
        with:
          stack-name: ${{ inputs.stack-prefix }}-e2e

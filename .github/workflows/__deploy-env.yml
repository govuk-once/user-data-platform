name: Deploy Environment

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub environment name (e.g. dev, staging). Leave empty to skip environment protection.'
        required: false
        type: string
        default: ''
      stack-prefix:
        description: 'CFN stack prefix (e.g. dev, stag)'
        required: true
        type: string
      nx-target:
        description: 'nx target to invoke (e.g. cdk:deploy:dev)'
        required: true
        type: string
      version:
        description: 'Base semver to write into package.json (e.g. 1.2.4)'
        required: true
        type: string
      prerelease-tag:
        description: 'If set, package.json version becomes <version>-<prerelease-tag>.<shortSha>'
        required: false
        type: string
        default: ''
      aws-region:
        required: false
        type: string
        default: 'eu-west-2'
      node-version:
        required: false
        type: string
        default: '22'
      expose-outputs:
        description: 'Whether to fetch e2e stack outputs (set false when no e2e stack exists, e.g. prod).'
        required: false
        type: boolean
        default: true
    outputs:
      codebuild-project:
        value: ${{ jobs.deploy.outputs.codebuild-project }}
      source-bucket:
        value: ${{ jobs.deploy.outputs.source-bucket }}
      source-path:
        value: ${{ jobs.deploy.outputs.source-path }}
    secrets:
      DEPLOYMENT_ROLE:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      codebuild-project: ${{ steps.get-outputs.outputs.codebuild-project }}
      source-bucket: ${{ steps.get-outputs.outputs.source-bucket }}
      source-path: ${{ steps.get-outputs.outputs.source-path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup pnpm
        run: |
          npm install -g pnpm
          pnpm install

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Configure AWS Credentials
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@56d6a583f00f6bad6d19d91d53a7bc3b8143d0e9 # v5.1.1
        with:
          role-to-assume: ${{ secrets.DEPLOYMENT_ROLE }}
          aws-region: ${{ inputs.aws-region }}
          output-credentials: true

      - name: Set package version
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE_TAG: ${{ inputs.prerelease-tag }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "${PRERELEASE_TAG}" ]; then
            SHORT_SHA="${SHA:0:7}"
            FINAL_VERSION="${VERSION}-${PRERELEASE_TAG}.${SHORT_SHA}"
          else
            FINAL_VERSION="${VERSION}"
          fi
          npm version "${FINAL_VERSION}" --no-git-tag-version
          echo "Set local package.json version to ${FINAL_VERSION}"

      - name: Deploy CDK stack
        env:
          CDK_DEPLOYMENT_ROLE_ARN: ${{ steps.aws-creds.outputs.authenticated-arn }}
          NX_TARGET: ${{ inputs.nx-target }}
        run: npx nx run "${NX_TARGET}"

      - name: Get Stack outputs
        id: get-outputs
        if: ${{ inputs.expose-outputs }}
        working-directory: cdk
        env:
          STACK_NAME: ${{ inputs.stack-prefix }}-e2e
        run: |
          CODEBUILD_PROJECT=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs[?OutputKey=='CodeBuildProjectName'].OutputValue" --output text)
          echo "codebuild-project=${CODEBUILD_PROJECT}" >> $GITHUB_OUTPUT
          echo "Codebuild Project: ${CODEBUILD_PROJECT}"
          SOURCE_BUCKET=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs[?OutputKey=='SourceBucketName'].OutputValue" --output text)
          echo "source-bucket=${SOURCE_BUCKET}" >> $GITHUB_OUTPUT
          echo "Source Bucket: ${SOURCE_BUCKET}"
          SOURCE_PATH=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs[?OutputKey=='SourcePath'].OutputValue" --output text)
          echo "source-path=${SOURCE_PATH}" >> $GITHUB_OUTPUT
          echo "Source Path: ${SOURCE_PATH}"

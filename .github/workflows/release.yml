name: Release Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-west-2
  NODE_VERSION: '20'

permissions:
  id-token: write
  contents: read

jobs:
  version:
    name: Version
    uses: ./.github/workflows/version.yml

  deploy-dev:
    name: Deploy to dev
    needs: version
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/__deploy-env.yml
    with:
      environment: dev
      stack-prefix: dev
      nx-target: cdk:deploy:dev
      version: ${{ needs.version.outputs.version }}
      prerelease-tag: rc
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.DEV_DEPLOYMENT_ROLE }}

  e2e-dev:
    name: E2E tests on dev
    needs: deploy-dev
    uses: ./.github/workflows/__e2e.yml
    with:
      codebuild-project: ${{ needs.deploy-dev.outputs.codebuild-project }}
      source-bucket: ${{ needs.deploy-dev.outputs.source-bucket }}
      source-path: ${{ needs.deploy-dev.outputs.source-path }}
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.DEV_DEPLOYMENT_ROLE }}

  perf-test-dev:
    name: 'Performance Tests'
    needs: deploy-dev
    uses: './.github/workflows/__perf-test.yml'
    with:
      environment: dev
      stack-prefix: dev
      aws-region: 'eu-west-2'
      perf-target: 'smoke'
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.DEV_DEPLOYMENT_ROLE }}

  deploy-staging:
    name: Deploy to staging
    needs: [e2e-dev, version]
    uses: ./.github/workflows/__deploy-env.yml
    with:
      environment: staging
      stack-prefix: stag
      nx-target: cdk:deploy:stag
      version: ${{ needs.version.outputs.version }}
      prerelease-tag: rc
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.STAGING_DEPLOYMENT_ROLE }}

  e2e-staging:
    name: E2E tests on staging
    needs: deploy-staging
    uses: ./.github/workflows/__e2e.yml
    with:
      codebuild-project: ${{ needs.deploy-staging.outputs.codebuild-project }}
      source-bucket: ${{ needs.deploy-staging.outputs.source-bucket }}
      source-path: ${{ needs.deploy-staging.outputs.source-path }}
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.STAGING_DEPLOYMENT_ROLE }}

  perf-test-staging:
    name: 'Performance Tests'
    needs: deploy-staging
    uses: './.github/workflows/__perf-test.yml'
    with:
      environment: stag
      stack-prefix: stag
      aws-region: 'eu-west-2'
      perf-target: 'baseline'
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.STAGING_DEPLOYMENT_ROLE }}

  tag-prod:
    name: Tag production release
    needs: [version, e2e-staging, perf-test-staging]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write

    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_UDPTAGRELEASE_GOVUK_ONCE_APP_ID }}
          private-key: ${{ secrets.GH_UDPTAGRELEASE_GOVUK_ONCE_PRIVATE_KEY }}

      - name: Create and push tag via GitHub API
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          NEW_VERSION: ${{ needs.version.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Tagging commit: ${COMMIT_SHA}"

          # Create an annotated tag object
          TAG_SHA=$(jq -n \
            --arg tag "v${NEW_VERSION}" \
            --arg message "Release version ${NEW_VERSION}" \
            --arg object "${COMMIT_SHA}" \
            '{tag: $tag, message: $message, object: $object, type: "commit"}' \
            | gh api "repos/${GITHUB_REPOSITORY}/git/tags" -X POST --input - -q '.sha')
          echo "Tag SHA: ${TAG_SHA}"

          # Create the tag reference
          jq -n \
            --arg ref "refs/tags/v${NEW_VERSION}" \
            --arg sha "${TAG_SHA}" \
            '{ref: $ref, sha: $sha}' \
            | gh api "repos/${GITHUB_REPOSITORY}/git/refs" -X POST --input -
          echo "Created and pushed tag v${NEW_VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          NEW_VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v${NEW_VERSION}" \
            --title "Release v${NEW_VERSION}" \
            --notes "## Changes in v${NEW_VERSION}

          This release was automatically generated from commits to main."

  deploy-prod:
    name: Deploy to production
    needs: [version, tag-prod]
    uses: ./.github/workflows/__deploy-env.yml
    with:
      stack-prefix: prod
      nx-target: cdk:deploy:prod
      version: ${{ needs.version.outputs.version }}
      expose-outputs: false
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.PRODUCTION_DEPLOYMENT_ROLE }}

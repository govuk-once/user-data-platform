name: Release Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-west-2
  NODE_VERSION: '24'

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  version:
    name: Create Release
    uses: govuk-once/github-actions-workflows/.github/workflows/semantic-release.yml@v1.1.2
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      node-version: ${{ vars.NODE_VERSION }}

  sonar-scan:
    name: Run SonarQube Scan
    uses: ./.github/workflows/sonar-scan.yml
    secrets:
      SONAR_TOKEN_UDP: ${{ secrets.SONAR_TOKEN_UDP }}
      SONAR_URL: ${{ secrets.SONAR_URL }}

  deploy-dev:
    name: Deploy to dev
    needs: [sonar-scan, version]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/__deploy-env.yml
    with:
      environment: dev
      stack-prefix: dev
      deploy-script: cdk:deploy:dev
      version: ${{ needs.version.outputs.version }}
      prerelease-tag: rc
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.DEV_DEPLOYMENT_ROLE }}

  e2e-dev:
    name: E2E tests on dev
    needs: deploy-dev
    uses: ./.github/workflows/__e2e.yml
    with:
      codebuild-project: ${{ needs.deploy-dev.outputs.codebuild-project }}
      source-bucket: ${{ needs.deploy-dev.outputs.source-bucket }}
      source-path: ${{ needs.deploy-dev.outputs.source-path }}
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.DEV_DEPLOYMENT_ROLE }}

  perf-test-dev:
    name: 'Performance Tests'
    needs: deploy-dev
    uses: './.github/workflows/__perf-test.yml'
    with:
      environment: dev
      stack-prefix: dev
      aws-region: 'eu-west-2'
      perf-target: 'smoke'
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.DEV_DEPLOYMENT_ROLE }}

  deploy-staging:
    name: Deploy to staging
    needs: [e2e-dev, version]
    uses: ./.github/workflows/__deploy-env.yml
    with:
      environment: staging
      stack-prefix: stag
      deploy-script: cdk:deploy:stag
      version: ${{ needs.version.outputs.version }}
      prerelease-tag: rc
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.STAGING_DEPLOYMENT_ROLE }}

  e2e-staging:
    name: E2E tests on staging
    needs: deploy-staging
    uses: ./.github/workflows/__e2e.yml
    with:
      codebuild-project: ${{ needs.deploy-staging.outputs.codebuild-project }}
      source-bucket: ${{ needs.deploy-staging.outputs.source-bucket }}
      source-path: ${{ needs.deploy-staging.outputs.source-path }}
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.STAGING_DEPLOYMENT_ROLE }}

  perf-test-staging:
    name: 'Performance Tests'
    needs: deploy-staging
    uses: './.github/workflows/__perf-test.yml'
    with:
      environment: stag
      stack-prefix: stag
      aws-region: 'eu-west-2'
      perf-target: 'baseline'
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.STAGING_DEPLOYMENT_ROLE }}

  deploy-prod:
    name: Deploy to production
    needs: [version, e2e-staging, perf-test-staging]
    uses: ./.github/workflows/__deploy-env.yml
    with:
      environment: production
      stack-prefix: prod
      deploy-script: cdk:deploy:prod
      version: ${{ needs.version.outputs.version }}
      expose-outputs: false
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.PRODUCTION_DEPLOYMENT_ROLE }}

  send-release-notification:
    name: Notify Production Release Slack channel
    needs: [version, deploy-prod]
    if: needs.version.outputs.released == 'true'
    uses: govuk-once/github-actions-workflows/.github/workflows/release-notification.yml@v1.1.2
    permissions:
      contents: read
      id-token: write
    with:
      application: 'UDP'
      version: ${{ needs.version.outputs.version }}
      type: ${{ needs.version.outputs.type }}
      slack-channel: ${{ vars.SLACK_RELEASE_CHANNEL }}
    secrets:
      deployment-role: ${{ secrets.AWS_DEPLOYMENT_ROLE }}

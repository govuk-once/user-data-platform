name: Release Pipeline

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  NODE_VERSION: '20'

permission:
  id-token: write
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      new_version: ${{ steps.tag_version.outputs.new_version }}
      changelog: ${{ steps.tag_version.outputs.changelog }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

      - name: Create Github Release
        uses: ncipollo/release-actions@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        run: |
          npm install -g pnpm@latest-10
          pnpm install

      - name: Setup NODE_VERSION
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependancies
        run: pnpm i --frozen-lockfile

      - name: Update package.json version
        run: |
          npm version ${{ steps.tag_version.outputs.new_version }} --no-git-tag-version
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add package.json
          git commit -m "chore: bump version to ${{ steps.tag_version.outputs.new_tag }}"

      - name: Regenerate OpenAPI docs
        run: pnpm generate:openapi

      - name: Commit OpenApi docs
        run: |
          git add docs/openapi.yml
          git commit -m "docs: update OpenApi spec for ${{ steps.tag_version.outputs.new_tag }}"
          git push

  deploy-staging:
    name: Deploy to staging
    needs: create-release
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      codebuild-project: ${{ steps.get-outputs.outputs.codebuild-project }}
      source-bucket: ${{ steps.get-outputs.outputs.source-bucket }}
      source-path: ${{ steps.get-outputs.outputs.source-path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.new_tag }}
          fetch-depth: 0

      - name: Setup pnpm
        run: |
          npm install -g pnpm@latest-10
          pnpm install

      - name: Setup NODE_VERSION
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependancies
        run: pnpm i --frozen-lockfile

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@4
        with:
          role-to-assume: ${{ secrets.STAGING_DEPLOYMENT_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CDK stack to staging
        runs: npx nx run cdk:deploy:stag

      - name: Get Stack outputs
        id: get-outputs
        working-directory: cdk
        runs: |
          CODEBUILD_PROJECT=$(aws cloudformation decribe-stacks --stack-name stag-e2e --query "Stacks[0].Outputs[?OutputKey=='CodeBuildProjectName'].OutputValue" --output text)
          echo "codebuild-project=${CODEBUILD_PROJECT}" >> $GITHUB_OUTPUT
          echo "COdebuild Project: ${CODEBUILD_PROJECT}"
          SOURCE_BUCKET=$(aws cloudformation describe-stacks --stack-name stag-e2e --query "Stacks[0].Outputs[?OutputKey=='SourceBucketName'].OutputValue" --output text)
          echo "source-bucket=${SOURCE_BUCKET}" >> $GITHUB_OUTPUT
          echo "Source Bucket: ${SOURCE_BUCKET}"
          SOURCE_PATH=$(aws cloudformation describe-stacks --stack-name stag-e2e --query "Stacks[0].Outputs[?OutputKey=='SourcePath'].OutputValue" --output text)
          echo "source-path=${SOURCE_PATH}" >> $GITHUB_OUTPUT
          echo "Source Path: ${SOURCE_PATH}"

  e2e-staging:
    name: E2E tests on staging
    needs: [create-release, deploy-staging]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.new_tag }}

      - name: Setup pnpm
        run: |
          npm install -g pnpm@latest-10
          pnpm install

      - name: Setup NODE_VERSION
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependancies
        run: pnpm i --frozen-lockfile

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@4
        with:
          role-to-assume: ${{ secrets.STAGING_DEPLOYMENT_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload source to S3
        run: |
          echo "UPLOADING source to s3 get store path"
          STORE_PATH=$(pnpm store path)
          pnpm store prune

          mkdir -p .pnpm-store
          cp -r "${STORE_PATH}"/* .pnpm-store/

          echo "UPLOADING source to s3 for e2e"
          zip -rqy source.zip . -x '.git/*' -x ',.nx/*' -x "cdk/cdk.out/*"
          aws s3 cp source.zip "s3://${{ needs.deploy.outputs.source-bucket }}/${{ needs.deploy.outputs.source-path }}"

      - name: Trigger Codebuild and wait for completion
        id: codebuild
        run: |
          echo "Starting Codebuild project: ${{ needs.deploy.outputs.codebuild-project }}"

          # Start Build
          BUILD_ID=$(aws codebuild start-build --project-name "${{ needs.deploy.outputs.codebuild-project }}" --query 'build.id' --output text)

          echo "Build started ${BUILD_ID}"
          echo "build-id=${BUILD_ID}" >> $GITHUB_OUTPUT

          # poll for completion
          while true; do
            BUILD_STATUS=$(aws codebuild batch-get-builds --ids "${BUILD_ID}" --query 'builds[0].buildStatus' --output text)
            CURRENT_PHASE=$(aws codebuild batch-get-builds --ids "${BUILD_ID}" --query 'builds[0].currentPhase' --output text)

            echo "Build status: ${BUILD_STATUS}, phase: ${CURRENT_PHASE}"

            case "${BUILD_STATUS}" in
              SUCCEEDED)
                echo "E2E tests passed!"
                exit 0
                ;;
              FAILED|FAULT|STOPPED|TIMED_OUT)
                echo "E2E tests failed with status &{BUILD_STATUS}"

                # get build logs
                BUILD_ARN=$(aws codebuild batch-get-builds --ids "${Build_ID}" --query 'builds[0].arn' --output text)
                echo "Build logs: https://${AWS_REGION}.console.aws.amazon.com/codesuite/codebuild/projects/${{ needs.deploy.outputs.codebuild-project }}/build/${BUILD_ID}"

                exit 1
                ;;
              IN_PROGRESS)
                sleep 30
                ;;
              *)
                echo "unknown status: ${BUILD_STATUS}"
                sleep 30
                ;;
            esac
          done


name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  NODE_VERSION: '20'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      codebuild-project: ${{ steps.get-outputs.outputs.codebuild-project }}
      source-bucket: ${{ steps.get-outputs.outputs.source-bucket }}
      source-path: ${{ steps.get-outputs.outputs.source-path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_DEPLOYMENT_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CDK stack to dev
        run: npx nx run cdk:deploy:dev

      - name: Get Stack outputs
        id: get-outputs
        uses: ./.github/actions/get-stack-outputs
        with:
          stack-name: stag-e2e
          aws-region: ${{ env.AWS_REGION }}

  e2e-dev:
    name: E2E tests on dev
    needs: deploy-dev
    uses: ./.github/workflows/e2e-tests.yml
    secrets:
      aws-role: ${{ secrets.DEV_DEPLOYMENT_ROLE }}
    with:
      codebuild-project: ${{ needs.deploy-dev.outputs.codebuild-project }}
      source-bucket: ${{ needs.deploy-dev.outputs.source-bucket }}
      source-path: ${{ needs.deploy-dev.outputs.source-path }}
      aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      node-version: ${{ vars.NODE_VERSION || '20' }}

  deploy-staging:
    name: Deploy to staging
    needs: e2e-dev
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      codebuild-project: ${{ steps.get-outputs.outputs.codebuild-project }}
      source-bucket: ${{ steps.get-outputs.outputs.source-bucket }}
      source-path: ${{ steps.get-outputs.outputs.source-path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.STAGING_DEPLOYMENT_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CDK stack to staging
        run: npx nx run cdk:deploy:stag

      - name: Get Stack outputs
        id: get-outputs
        uses: ./.github/actions/get-stack-outputs
        with:
          stack-name: stag-e2e
          aws-region: ${{ env.AWS_REGION }}

  e2e-staging:
    name: E2E tests on staging
    needs: deploy-staging
    uses: ./.github/workflows/e2e-tests.yml
    secrets:
      aws-role: ${{ secrets.STAGING_DEPLOYMENT_ROLE }}
    with:
      codebuild-project: ${{ needs.deploy-staging.outputs.codebuild-project }}
      source-bucket: ${{ needs.deploy-staging.outputs.source-bucket }}
      source-path: ${{ needs.deploy-staging.outputs.source-path }}
      aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      node-version: ${{ vars.NODE_VERSION || '20' }}


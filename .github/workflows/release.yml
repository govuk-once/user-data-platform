name: Release Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-west-2
  NODE_VERSION: '24'

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  version:
    name: Version
    uses: ./.github/workflows/version.yml
    secrets:
      GH_UDPTAGRELEASE_GOVUK_ONCE_APP_ID: ${{ secrets.GH_UDPTAGRELEASE_GOVUK_ONCE_APP_ID }}
      GH_UDPTAGRELEASE_GOVUK_ONCE_PRIVATE_KEY: ${{ secrets.GH_UDPTAGRELEASE_GOVUK_ONCE_PRIVATE_KEY }}
      DEPLOYMENT_ROLE: ${{ secrets.DEV_DEPLOYMENT_ROLE }}
      CODEARTIFACT_ACCOUNT: ${{ secrets.CODEARTIFACT_ACCOUNT }}

  sonar-scan:
    name: Run SonarQube Scan
    uses: ./.github/workflows/sonar-scan.yml
    secrets:
      SONAR_TOKEN_UDP: ${{ secrets.SONAR_TOKEN_UDP }}
      SONAR_URL: ${{ secrets.SONAR_URL }}
      DEPLOYMENT_ROLE: ${{ secrets.DEV_DEPLOYMENT_ROLE }}
      CODEARTIFACT_ACCOUNT: ${{ secrets.CODEARTIFACT_ACCOUNT }}

  deploy-dev:
    name: Deploy to dev
    needs: [sonar-scan, version]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/__deploy-env.yml
    with:
      environment: dev
      stack-prefix: dev
      deploy-script: cdk:deploy:dev
      version: ${{ needs.version.outputs.version }}
      prerelease-tag: rc
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.DEV_DEPLOYMENT_ROLE }}
      CODEARTIFACT_ACCOUNT: ${{ secrets.CODEARTIFACT_ACCOUNT }}

  deploy-monitoring-dev:
    name: Deploy monitoring to dev
    needs: [deploy-dev]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/__deploy-monitoring.yml
    with:
      environment: dev
      stack-prefix: dev
      deploy-script: cdk:deploy:monitoring:dev
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.DEV_DEPLOYMENT_ROLE }}
      CODEARTIFACT_ACCOUNT: ${{ secrets.CODEARTIFACT_ACCOUNT }}

  e2e-dev:
    name: E2E tests on dev
    needs: deploy-dev
    uses: ./.github/workflows/__e2e.yml
    with:
      codebuild-project: ${{ needs.deploy-dev.outputs.codebuild-project }}
      source-bucket: ${{ needs.deploy-dev.outputs.source-bucket }}
      source-path: ${{ needs.deploy-dev.outputs.source-path }}
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.DEV_DEPLOYMENT_ROLE }}
      CODEARTIFACT_ACCOUNT: ${{ secrets.CODEARTIFACT_ACCOUNT }}

  perf-test-dev:
    name: 'Performance Tests'
    needs: deploy-dev
    uses: './.github/workflows/__perf-test.yml'
    with:
      environment: dev
      stack-prefix: dev
      aws-region: 'eu-west-2'
      perf-target: 'smoke'
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.DEV_DEPLOYMENT_ROLE }}
      CODEARTIFACT_ACCOUNT: ${{ secrets.CODEARTIFACT_ACCOUNT }}

  deploy-staging:
    name: Deploy to staging
    needs: [e2e-dev, version]
    uses: ./.github/workflows/__deploy-env.yml
    with:
      environment: staging
      stack-prefix: stag
      deploy-script: cdk:deploy:stag
      version: ${{ needs.version.outputs.version }}
      prerelease-tag: rc
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.STAGING_DEPLOYMENT_ROLE }}
      CODEARTIFACT_ACCOUNT: ${{ secrets.CODEARTIFACT_ACCOUNT }}

  deploy-monitoring-staging:
    name: Deploy monitoring to staging
    needs: [deploy-staging]
    uses: ./.github/workflows/__deploy-monitoring.yml
    with:
      environment: staging
      stack-prefix: stag
      deploy-script: cdk:deploy:monitoring:stag
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.STAGING_DEPLOYMENT_ROLE }}
      CODEARTIFACT_ACCOUNT: ${{ secrets.CODEARTIFACT_ACCOUNT }}

  e2e-staging:
    name: E2E tests on staging
    needs: deploy-staging
    uses: ./.github/workflows/__e2e.yml
    with:
      codebuild-project: ${{ needs.deploy-staging.outputs.codebuild-project }}
      source-bucket: ${{ needs.deploy-staging.outputs.source-bucket }}
      source-path: ${{ needs.deploy-staging.outputs.source-path }}
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.STAGING_DEPLOYMENT_ROLE }}
      CODEARTIFACT_ACCOUNT: ${{ secrets.CODEARTIFACT_ACCOUNT }}

  perf-test-staging:
    name: 'Performance Tests'
    needs: deploy-staging
    uses: './.github/workflows/__perf-test.yml'
    with:
      environment: stag
      stack-prefix: stag
      aws-region: 'eu-west-2'
      perf-target: 'baseline'
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.STAGING_DEPLOYMENT_ROLE }}
      CODEARTIFACT_ACCOUNT: ${{ secrets.CODEARTIFACT_ACCOUNT }}

  deploy-prod:
    name: Deploy to production
    needs: [version, e2e-staging, perf-test-staging]
    uses: ./.github/workflows/__deploy-env.yml
    with:
      environment: production
      stack-prefix: prod
      deploy-script: cdk:deploy:prod
      version: ${{ needs.version.outputs.version }}
      expose-outputs: false
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.PRODUCTION_DEPLOYMENT_ROLE }}
      CODEARTIFACT_ACCOUNT: ${{ secrets.CODEARTIFACT_ACCOUNT }}

  deploy-monitoring-prod:
    name: Deploy monitoring to production
    needs: [deploy-prod]
    uses: ./.github/workflows/__deploy-monitoring.yml
    with:
      environment: production
      stack-prefix: prod
      deploy-script: cdk:deploy:monitoring:prod
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.PRODUCTION_DEPLOYMENT_ROLE }}
      CODEARTIFACT_ACCOUNT: ${{ secrets.CODEARTIFACT_ACCOUNT }}

  send-release-notification:
    if: needs.version.outputs.type == 'major' || needs.version.outputs.type == 'minor'
    name: Send Release Notification
    needs: [version, deploy-monitoring-prod]
    uses: ./.github/workflows/slack-release-notification.yml
    with:
      version: ${{ needs.version.outputs.version }}
      type: ${{ needs.version.outputs.type }}
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.PRODUCTION_DEPLOYMENT_ROLE }}
      RELEASE_NOTIFICATIONS_TOPIC_ARN: ${{ secrets.RELEASE_NOTIFICATIONS_TOPIC_ARN }}
      CODEARTIFACT_ACCOUNT: ${{ secrets.CODEARTIFACT_ACCOUNT }}

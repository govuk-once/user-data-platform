name: Release Candidate

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-pr:
    name: Validate PR
    uses: ./.github/workflows/__validate-pr.yml
  ci:
    needs: validate-pr
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6 # v6.0.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f #v6 # v6.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          python3 -m pip install semgrep pre-commit checkov
          npm install -g pnpm
          pnpm install --frozen-lockfile

      - name: Run Hygiene & Security Checks
        run: SKIP=format-check,linting-check,checkov-scan,semgrep pre-commit run --all-files --show-diff-on-failure

      - name: Run Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.0
        with:
          fail-on-severity: high # Will fail on newly introduced vulnerabilities
          license-check: false

      - name: NX - set SHAs
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0

      - name: Validate Conventional Commits
        run: |
          echo "Validating commit messages..."

          # Get all commits in the PR
          git fetch origin main
          COMMITS=$(git log --pretty=format:"%s" origin/main..HEAD)

          if [ -z "$COMMITS" ]; then
            echo "No commits found in PR"
            exit 1
          fi

          echo "Commits to validate:"
          echo "$COMMITS"
          echo ""

          # Check if at least one commit follows conventional commits
          VALID_PATTERN="^(feat|fix|docs|style|refactor|perf|test|chore|build|ci|revert)(\(.+\))?(!)?:"

          VALID_COUNT=0
          INVALID_COMMITS=""

          while IFS= read -r commit; do
            if echo "$commit" | grep -qE "$VALID_PATTERN"; then
              VALID_COUNT=$((VALID_COUNT + 1))
              echo "✓ Valid: $commit"
            else
              INVALID_COMMITS="${INVALID_COMMITS}\n  - $commit"
              echo "✗ Invalid: $commit"
            fi
          done <<< "$COMMITS"

          echo ""
          echo "Summary: $VALID_COUNT valid commit(s) found"

          if [ $VALID_COUNT -eq 0 ]; then
            echo ""
            echo "❌ ERROR: No commits follow conventional commit format"
            echo ""
            echo "Invalid commits:$INVALID_COMMITS"
            echo ""
            echo "Conventional commit format: <type>(<scope>): <description>"
            echo ""
            echo "Types: feat, fix, docs, style, refactor, perf, test, chore, build, ci, revert"
            echo ""
            echo "Examples:"
            echo "  feat: add new feature"
            echo "  fix: resolve bug in authentication"
            echo "  feat(api): add new endpoint"
            echo "  feat!: breaking change"
            echo ""
            exit 1
          fi

          echo "✅ Commit message validation passed"

      - name: Lint & format checks
        run: |
          pnpm lint:all
          pnpm format:check

      - name: Build
        run: pnpm build:all

      - name: Unit Tests
        run: pnpm test:all

      - name: Configure AWS Credentials for Checkov Scan Synth
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@56d6a583f00f6bad6d19d91d53a7bc3b8143d0e9 # v5.1.1
        env:
          AWS_REGION: eu-west-2
        with:
          role-to-assume: ${{ secrets.DEPLOYMENT_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Checkov Security Scan
        run: |
          rm -rf cdk/cdk.out
          (cd cdk && npx cdk synth --quiet > /dev/null)
          checkov -d cdk/cdk.out --config-file cdk/.checkov.yaml

      - name: Semgrep Security Scan
        run: semgrep scan $(cat .semgrep-args.txt) --error .

  sonar-scan:
    needs: validate-pr
    name: Run SonarQube Scan
    uses: ./.github/workflows/sonar-scan.yml
    secrets:
      SONAR_TOKEN_UDP: ${{ secrets.SONAR_TOKEN_UDP }}
      SONAR_URL: ${{ secrets.SONAR_URL }}

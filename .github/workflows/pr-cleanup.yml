name: PR Environment Cleanup

on:
  pull_request:
    types: [closed]

env:
  AWS_REGION: eu-west-2
  DEVELOPER_ID: pr-${{ github.event.pull_request.number }}

permissions:
  id-token: write
  contents: read

jobs:
  cleanup:
    name: Destroy PR Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          persist-credentials: false

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Configure AWS credentials
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@56d6a583f00f6bad6d19d91d53a7bc3b8143d0e9 # v5.1.1
        with:
          role-to-assume: ${{ secrets.DEV_DEPLOYMENT_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          output-credentials: true

      - name: Destroy CDK stacks
        env:
          CDK_DEPLOYMENT_ROLE_ARN: ${{ steps.aws-creds.outputs.authenticated-arn }}
        run: npx nx run cdk:destroy:dev

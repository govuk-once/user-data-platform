name: Deploy Monitoring Stack

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub environment name (e.g. dev, stag). Leave empty to skip environment protection.'
        required: false
        type: string
        default: ''
      nx-target:
        description: 'nx target to invoke (e.g. cdk:deploy:monitoring:dev)'
        required: true
        type: string
      developer-id:
        description: 'Developer/PR identifier for scoped deployments (e.g. pr-123). Leave empty for shared environments.'
        required: false
        type: string
        default: ''
      aws-region:
        required: false
        type: string
        default: 'eu-west-2'
      node-version:
        required: false
        type: string
        default: '24'
    secrets:
      DEPLOYMENT_ROLE:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy-monitoring:
    name: Deploy monitoring to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-monitoring-${{ inputs.developer-id }}-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup pnpm
        run: npm install -g pnpm

      - name: Install Dependencies
        run: |
          python3 -m pip install checkov
          pnpm install --frozen-lockfile

      - name: Configure AWS Credentials
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@56d6a583f00f6bad6d19d91d53a7bc3b8143d0e9 # v5.1.1
        with:
          role-to-assume: ${{ secrets.DEPLOYMENT_ROLE }}
          aws-region: ${{ inputs.aws-region }}
          output-credentials: true

      - name: Discover monitored resources
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_REGION: ${{ inputs.aws-region }}
          DEVELOPER_ID: ${{ inputs.developer-id }}
          AWS_ACCESS_KEY_ID: ${{ steps.aws-creds.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-creds.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-creds.outputs.aws-session-token }}
        run: npx tsx cdk/scripts/discover-monitoring.ts

      - name: Set Monitoring Stack Name
        env:
          DEVELOPER_ID: ${{ inputs.developer-id }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ -n "$DEVELOPER_ID" ]; then
            STACK_NAME="${DEVELOPER_ID}-${ENVIRONMENT}-monitoring"
          else
            STACK_NAME="${ENVIRONMENT}-monitoring"
          fi
          echo "STACK_NAME=$STACK_NAME" >> "$GITHUB_ENV"

      - name: Synthesize Monitoring Stack
        env:
          DEVELOPER_ID: ${{ inputs.developer-id }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          rm -rf cdk/cdk.out
          (cd cdk && npx cdk synth "${STACK_NAME}" -c env="${ENVIRONMENT}" -c skipMainStack=true --quiet)

      - name: Compare Monitoring Template Hash
        id: compare
        env:
          AWS_REGION: ${{ inputs.aws-region }}
        run: |
          TEMPLATE_FILE="cdk/cdk.out/${STACK_NAME}.template.json"
          SSM_PARAM="/upd/${STACK_NAME}/template-hash"

          # Calculate hash of the synthesized template
          CURRENT_HASH=$(sha256sum "${TEMPLATE_FILE}" | awk '{print $1}')
          echo "CURRENT_HASH=${CURRENT_HASH}" >> "$GITHUB_ENV"
          echo "Current template hash: ${CURRENT_HASH}"

          # Retrieve previous hash from SSM (absent on first deploy)
          PREVIOUS_HASH=$(aws ssm get-parameter \
            --name "${SSM_PARAM}" \
            --query "Parameter.Value" \
            --output text 2>/dev/null || echo "")

          # Check the CloudFormation stack actually exists.
          STACK_EXISTS=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "")

          if [ -z "${PREVIOUS_HASH}" ]; then
            echo "No previous hash found in SSM — first deployment."
            echo "deploy_required=true" >> "$GITHUB_OUTPUT"
          elif [ -z "${STACK_EXISTS}" ]; then
            echo "Stack ${STACK_NAME} does not exist in CloudFormation — deployment required."
            echo "deploy_required=true" >> "$GITHUB_OUTPUT"
          elif [ "${CURRENT_HASH}" != "${PREVIOUS_HASH}" ]; then
            echo "Template changed (${PREVIOUS_HASH} → ${CURRENT_HASH}) — deployment required."
            echo "deploy_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "Template unchanged and stack exists — skipping deployment."
            echo "deploy_required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkov Security Scan
        if: steps.compare.outputs.deploy_required == 'true'
        env:
          DEVELOPER_ID: ${{ inputs.developer-id }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          checkov -f "cdk/cdk.out/${STACK_NAME}.template.json" --config-file cdk/.checkov.yaml

      - name: Deploy monitoring CDK stack
        if: steps.compare.outputs.deploy_required == 'true'
        env:
          CDK_DEPLOYMENT_ROLE_ARN: ${{ steps.aws-creds.outputs.authenticated-arn }}
          NX_TARGET: ${{ inputs.nx-target }}
          DEVELOPER_ID: ${{ inputs.developer-id }}
        run: npx nx run "${NX_TARGET}"

      - name: Save Monitoring Template Hash
        if: steps.compare.outputs.deploy_required == 'true'
        env:
          AWS_REGION: ${{ inputs.aws-region }}
        run: |
          SSM_PARAM="/upd/${STACK_NAME}/template-hash"
          aws ssm put-parameter \
            --name "${SSM_PARAM}" \
            --value "${CURRENT_HASH}" \
            --type String \
            --overwrite
          echo "Saved monitoring template hash to ${SSM_PARAM}"

name: Deploy Monitoring Stack

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub environment name (e.g. dev, stag). Leave empty to skip environment protection.'
        required: false
        type: string
        default: ''
      stack-prefix:
        description: 'CFN stack prefix (e.g. dev, stag, pr-123-dev)'
        required: true
        type: string
      deploy-script:
        description: 'package.json script that builds and deploys the environment'
        required: true
        type: string
      developer-id:
        description: 'Developer/PR identifier for scoped deployments (e.g. pr-123). Leave empty for shared environments.'
        required: false
        type: string
        default: ''
      aws-region:
        required: false
        type: string
        default: 'eu-west-2'
      node-version:
        required: false
        type: string
        default: '24'
    secrets:
      DEPLOYMENT_ROLE:
        required: true
      CODEARTIFACT_ACCOUNT:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy-monitoring:
    name: Deploy monitoring to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-monitoring-${{ inputs.developer-id }}-${{ inputs.stack-prefix }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure AWS Credentials
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@56d6a583f00f6bad6d19d91d53a7bc3b8143d0e9 # v5.1.1
        with:
          role-to-assume: ${{ secrets.DEPLOYMENT_ROLE }}
          aws-region: ${{ inputs.aws-region }}
          output-credentials: true

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ inputs.node-version }}
          codeartifact-account: ${{ secrets.CODEARTIFACT_ACCOUNT }}

      - name: Install security tooling
        run: python3 -m pip install checkov

      - name: Discover monitored resources
        env:
          ENVIRONMENT: ${{ inputs.stack-prefix }}
          AWS_REGION: ${{ inputs.aws-region }}
          DEVELOPER_ID: ${{ inputs.developer-id }}
          AWS_ACCESS_KEY_ID: ${{ steps.aws-creds.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-creds.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-creds.outputs.aws-session-token }}
        run: npx tsx cdk/scripts/discover-monitoring.ts

      - name: Set Monitoring Stack Name and SSM Param
        env:
          DEVELOPER_ID: ${{ inputs.developer-id }}
          ENVIRONMENT: ${{ inputs.stack-prefix }}
        run: |
          if [ -n "$DEVELOPER_ID" ]; then
            STACK_NAME="${DEVELOPER_ID}-${ENVIRONMENT}-monitoring"
          else
            STACK_NAME="${ENVIRONMENT}-monitoring"
          fi
          echo "STACK_NAME=$STACK_NAME" >> "$GITHUB_ENV"
          echo "SSM_PARAM=/udp/${STACK_NAME}/template-hash" >> "$GITHUB_ENV"

      - name: Synthesize Monitoring Stack
        env:
          DEVELOPER_ID: ${{ inputs.developer-id }}
          ENVIRONMENT: ${{ inputs.stack-prefix }}
        run: |
          rm -rf cdk/cdk.out
          (cd cdk && npx cdk synth "${STACK_NAME}" -c env="${ENVIRONMENT}" -c skipMainStack=true --quiet)

      - name: Compare Monitoring Template Hash
        id: compare
        env:
          AWS_REGION: ${{ inputs.aws-region }}
        run: |
          CURRENT_HASH=$(sha256sum "cdk/cdk.out/${STACK_NAME}.template.json" | awk '{print $1}')
          echo "CURRENT_HASH=${CURRENT_HASH}" >> "$GITHUB_ENV"

          PREVIOUS_HASH=$(aws ssm get-parameter --name "${SSM_PARAM}" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          STACK_EXISTS=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "")

          if [ -z "${PREVIOUS_HASH}" ]; then
            echo "No previous hash in SSM — first deployment."
          elif [ -z "${STACK_EXISTS}" ]; then
            echo "Stack does not exist — deployment required."
          elif [ "${CURRENT_HASH}" != "${PREVIOUS_HASH}" ]; then
            echo "Template changed (${PREVIOUS_HASH} → ${CURRENT_HASH}) — deployment required."
          else
            echo "Template unchanged and stack exists — skipping deployment."
            echo "deploy_required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy_required=true" >> "$GITHUB_OUTPUT"

      - name: Checkov Security Scan
        if: steps.compare.outputs.deploy_required == 'true'
        run: checkov -f "cdk/cdk.out/${STACK_NAME}.template.json" --config-file cdk/.checkov.yaml

      - name: Deploy monitoring CDK stack
        if: steps.compare.outputs.deploy_required == 'true'
        env:
          CDK_DEPLOYMENT_ROLE_ARN: ${{ steps.aws-creds.outputs.authenticated-arn }}
          DEPLOY_SCRIPT: ${{ inputs.deploy-script }}
          DEVELOPER_ID: ${{ inputs.developer-id }}
        run: pnpm run "${DEPLOY_SCRIPT}"

      - name: Save Monitoring Template Hash
        if: steps.compare.outputs.deploy_required == 'true'
        env:
          AWS_REGION: ${{ inputs.aws-region }}
        run: |
          aws ssm put-parameter \
            --name "${SSM_PARAM}" \
            --value "${CURRENT_HASH}" \
            --type String \
            --overwrite
          echo "Saved template hash to ${SSM_PARAM}"

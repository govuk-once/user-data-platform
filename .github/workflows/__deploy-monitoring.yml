name: Deploy Monitoring Stack

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub environment name (e.g. dev, staging). Leave empty to skip environment protection.'
        required: false
        type: string
        default: ''
      nx-target:
        description: 'nx target to invoke (e.g. cdk:deploy:monitoring:dev)'
        required: true
        type: string
      developer-id:
        description: 'Developer/PR identifier for scoped deployments (e.g. pr-123). Leave empty for shared environments.'
        required: false
        type: string
        default: ''
      aws-region:
        required: false
        type: string
        default: 'eu-west-2'
      node-version:
        required: false
        type: string
        default: '24'
    secrets:
      DEPLOYMENT_ROLE:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy-monitoring:
    name: Deploy monitoring to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup pnpm
        run: npm install -g pnpm

      - name: Install Dependencies
        run: |
          python3 -m pip install checkov
          pnpm install --frozen-lockfile

      - name: Configure AWS Credentials
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@56d6a583f00f6bad6d19d91d53a7bc3b8143d0e9 # v5.1.1
        with:
          role-to-assume: ${{ secrets.DEPLOYMENT_ROLE }}
          aws-region: ${{ inputs.aws-region }}
          output-credentials: true

      - name: Discover monitored resources
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_REGION: ${{ inputs.aws-region }}
          DEVELOPER_ID: ${{ inputs.developer-id }}
          AWS_ACCESS_KEY_ID: ${{ steps.aws-creds.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-creds.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-creds.outputs.aws-session-token }}
        run: npx tsx cdk/scripts/discover-monitoring.ts

      - name: Set Monitoring Stack Name
        env:
          DEVELOPER_ID: ${{ inputs.developer-id }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ -n "$DEVELOPER_ID" ]; then
            STACK_NAME="${DEVELOPER_ID}-${ENVIRONMENT}-monitoring"
          else
            STACK_NAME="${ENVIRONMENT}-monitoring"
          fi
          echo "STACK_NAME=$STACK_NAME" >> "$GITHUB_ENV"

      - name: Checkov Security Scan
        env:
          DEVELOPER_ID: ${{ inputs.developer-id }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          rm -rf cdk/cdk.out
          (cd cdk && npx cdk synth "${STACK_NAME}" -c env="${ENVIRONMENT}" --quiet)
          checkov -f "cdk/cdk.out/${STACK_NAME}.template.json" --config-file cdk/.checkov.yaml

      - name: Deploy monitoring CDK stack
        env:
          CDK_DEPLOYMENT_ROLE_ARN: ${{ steps.aws-creds.outputs.authenticated-arn }}
          NX_TARGET: ${{ inputs.nx-target }}
          DEVELOPER_ID: ${{ inputs.developer-id }}
        run: npx nx run "${NX_TARGET}"

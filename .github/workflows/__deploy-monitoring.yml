name: Deploy Monitoring Stack

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub environment name (e.g. dev, staging). Leave empty to skip environment protection.'
        required: false
        type: string
        default: ''
      stack-prefix:
        description: 'CFN stack prefix (e.g. dev, stag, prod)'
        required: true
        type: string
      nx-target:
        description: 'nx target to invoke (e.g. cdk:deploy:monitoring:dev)'
        required: true
        type: string
      version:
        description: 'Base semver to write into package.json (e.g. 1.2.4)'
        required: true
        type: string
      prerelease-tag:
        description: 'If set, package.json version becomes <version>-<prerelease-tag>.<shortSha>'
        required: false
        type: string
        default: ''
      developer-id:
        description: 'Developer/PR identifier for scoped deployments (e.g. pr-123). Leave empty for shared environments.'
        required: false
        type: string
        default: ''
      aws-region:
        required: false
        type: string
        default: 'eu-west-2'
      node-version:
        required: false
        type: string
        default: '24'
    secrets:
      DEPLOYMENT_ROLE:
        required: true

  workflow_dispatch:
    inputs:
      environment:
        description: 'GitHub environment name (e.g. dev, staging). Leave empty to skip environment protection.'
        required: false
        type: string
        default: ''
      stack-prefix:
        description: 'CFN stack prefix / environment name (e.g. dev, stag, prod)'
        required: true
        type: string
      nx-target:
        description: 'nx target to invoke (e.g. cdk:deploy:monitoring:dev)'
        required: true
        type: string
      version:
        description: 'Base semver to write into package.json (e.g. 1.2.4)'
        required: true
        type: string
      prerelease-tag:
        description: 'If set, package.json version becomes <version>-<prerelease-tag>.<shortSha>'
        required: false
        type: string
        default: ''
      developer-id:
        description: 'Developer/PR identifier for scoped deployments (e.g. pr-123). Leave empty for shared environments.'
        required: false
        type: string
        default: ''
      aws-region:
        required: false
        type: string
        default: 'eu-west-2'
      node-version:
        required: false
        type: string
        default: '24'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-monitoring:
    name: Deploy monitoring to ${{ inputs.environment || inputs.stack-prefix }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        run: |
          npm install -g pnpm
          pnpm install

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f #v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Configure AWS Credentials
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@56d6a583f00f6bad6d19d91d53a7bc3b8143d0e9 # v5.1.1
        with:
          role-to-assume: ${{ secrets.DEPLOYMENT_ROLE }}
          aws-region: ${{ inputs.aws-region }}
          output-credentials: true

      - name: Set package version
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE_TAG: ${{ inputs.prerelease-tag }}
          SHA: ${{ github.sha }}
        run: |
          echo "FINAL_VERSION in else: ${FINAL_VERSION}"
          if [ -n "${PRERELEASE_TAG}" ]; then
            SHORT_SHA="${SHA:0:7}"
            FINAL_VERSION="${VERSION}-${PRERELEASE_TAG}.${SHORT_SHA}"
          else
            FINAL_VERSION="${VERSION}"
          fi
          echo "Set local package.json version to ${FINAL_VERSION}"
          npm version "${FINAL_VERSION}" --no-git-tag-version

      - name: Discover monitored resources
        env:
          ENVIRONMENT: ${{ inputs.stack-prefix }}
          AWS_REGION: ${{ inputs.aws-region }}
          DEVELOPER_ID: ${{ inputs.developer-id }}
          AWS_ACCESS_KEY_ID: ${{ steps.aws-creds.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-creds.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-creds.outputs.aws-session-token }}
        run: npx tsx cdk/scripts/discover-monitoring.ts

      - name: Deploy monitoring CDK stack
        env:
          CDK_DEPLOYMENT_ROLE_ARN: ${{ steps.aws-creds.outputs.authenticated-arn }}
          NX_TARGET: ${{ inputs.nx-target }}
          DEVELOPER_ID: ${{ inputs.developer-id }}
        run: npx nx run "${NX_TARGET}"

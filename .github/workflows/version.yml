name: Auto Version on Main

on:
  workflow_call:
    secrets:
      GH_UDPTAGRELEASE_GOVUK_ONCE_APP_ID:
        required: true
      GH_UDPTAGRELEASE_GOVUK_ONCE_PRIVATE_KEY:
        required: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_UDPTAGRELEASE_GOVUK_ONCE_APP_ID }}
          private-key: ${{ secrets.GH_UDPTAGRELEASE_GOVUK_ONCE_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get current version
        id: current-version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Determine version bump
        id: bump
        run: |
          # Get commit messages since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            # No tags yet, get all commits
            COMMITS=$(git log --pretty=format:"%s" HEAD)
          else
            COMMITS=$(git log --pretty=format:"%s" ${LAST_TAG}..HEAD)
          fi

          echo "Analyzing commits:"
          echo "$COMMITS"

          # Determine bump type based on conventional commits
          if echo "$COMMITS" | grep -qE "^(feat|feature)(\(.+\))?!:|^BREAKING CHANGE:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE "^(feat|feature)(\(.+\))?:"; then
            BUMP="minor"
          elif echo "$COMMITS" | grep -qE "^(fix|docs|style|refactor|perf|test|chore)(\(.+\))?:"; then
            BUMP="patch"
          else
            BUMP="patch"
          fi

          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "Version bump type: $BUMP"

      - name: Calculate new version
        id: new-version
        env:
          CURRENT_VERSION: ${{ steps.current-version.outputs.version }}
          BUMP_TYPE: ${{ steps.bump.outputs.bump }}
        run: |
          CURRENT="${CURRENT_VERSION}"
          BUMP="${BUMP_TYPE}"

          # Split version into parts
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"

          # Increment based on bump type
          case $BUMP in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Update package.json version
        env:
          NEW_VERSION: ${{ steps.new-version.outputs.version }}
        run: |
          npm version "${NEW_VERSION}" --no-git-tag-version
          echo "Updated package.json to version $NEW_VERSION"

      - name: Commit and push via GitHub API
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          NEW_VERSION: ${{ steps.new-version.outputs.version }}
        run: |
          # Commits created via the GitHub Git Data API are automatically
          # signed/verified by GitHub, satisfying org-level commit signing
          # rulesets that block unsigned pushes from git CLI.

          # 1. Get the current HEAD commit on main
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" -q '.object.sha')
          echo "Current commit: ${CURRENT_SHA}"

          # 2. Create a blob for the updated package.json
          BLOB_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/blobs" \
            -X POST \
            -f content="$(base64 -w 0 package.json)" \
            -f encoding="base64" \
            -q '.sha')
          echo "Blob SHA: ${BLOB_SHA}"

          # 3. Get the current tree
          TREE_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${CURRENT_SHA}" -q '.tree.sha')
          echo "Tree SHA: ${TREE_SHA}"

          # 4. Create a new tree with the updated package.json
          NEW_TREE_SHA=$(jq -n \
            --arg base_tree "${TREE_SHA}" \
            --arg blob_sha "${BLOB_SHA}" \
            '{base_tree: $base_tree, tree: [{path: "package.json", mode: "100644", type: "blob", sha: $blob_sha}]}' \
            | gh api "repos/${GITHUB_REPOSITORY}/git/trees" -X POST --input - -q '.sha')
          echo "New tree SHA: ${NEW_TREE_SHA}"

          # 5. Create a signed commit via the API
          NEW_COMMIT_SHA=$(jq -n \
            --arg message "chore: bump version to ${NEW_VERSION} [skip ci]" \
            --arg tree "${NEW_TREE_SHA}" \
            --arg parent "${CURRENT_SHA}" \
            '{message: $message, tree: $tree, parents: [$parent]}' \
            | gh api "repos/${GITHUB_REPOSITORY}/git/commits" -X POST --input - -q '.sha')
          echo "New commit SHA: ${NEW_COMMIT_SHA}"

          # 6. Update the main branch to point to the new commit
          jq -n --arg sha "${NEW_COMMIT_SHA}" '{sha: $sha}' \
            | gh api "repos/${GITHUB_REPOSITORY}/git/refs/heads/main" -X PATCH --input -
          echo "Updated main branch to ${NEW_COMMIT_SHA}"

      - name: Create and push tag via GitHub API
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          NEW_VERSION: ${{ steps.new-version.outputs.version }}
        run: |
          # Get the commit SHA that main now points to
          COMMIT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" -q '.object.sha')

          # Create an annotated tag object
          TAG_SHA=$(jq -n \
            --arg tag "v${NEW_VERSION}" \
            --arg message "Release version ${NEW_VERSION}" \
            --arg object "${COMMIT_SHA}" \
            '{tag: $tag, message: $message, object: $object, type: "commit"}' \
            | gh api "repos/${GITHUB_REPOSITORY}/git/tags" -X POST --input - -q '.sha')
          echo "Tag SHA: ${TAG_SHA}"

          # Create the tag reference
          jq -n \
            --arg ref "refs/tags/v${NEW_VERSION}" \
            --arg sha "${TAG_SHA}" \
            '{ref: $ref, sha: $sha}' \
            | gh api "repos/${GITHUB_REPOSITORY}/git/refs" -X POST --input -
          echo "Created and pushed tag v${NEW_VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          NEW_VERSION: ${{ steps.new-version.outputs.version }}
          BUMP_TYPE: ${{ steps.bump.outputs.bump }}
        run: |
          gh release create "v${NEW_VERSION}" \
            --title "Release v${NEW_VERSION}" \
            --notes "## Changes in v${NEW_VERSION}

          This release was automatically generated from commits to main.

          **Version bump type**: ${BUMP_TYPE}"

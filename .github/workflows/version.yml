name: Create Release

on:
  workflow_call:
    secrets:
      GH_UDPTAGRELEASE_GOVUK_ONCE_APP_ID:
        required: true
      GH_UDPTAGRELEASE_GOVUK_ONCE_PRIVATE_KEY:
        required: true
      DEPLOYMENT_ROLE:
        required: true
      CODEARTIFACT_ACCOUNT:
        required: true
    outputs:
      version:
        description: 'The new semantic version number'
        value: ${{ jobs.version.outputs.version }}
      type:
        description: 'The type of release (major, minor, patch)'
        value: ${{ jobs.version.outputs.type }}

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      type: ${{ steps.release.outputs.type }}
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.GH_UDPTAGRELEASE_GOVUK_ONCE_APP_ID }}
          private-key: ${{ secrets.GH_UDPTAGRELEASE_GOVUK_ONCE_PRIVATE_KEY }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@56d6a583f00f6bad6d19d91d53a7bc3b8143d0e9 # v5.1.1
        with:
          role-to-assume: ${{ secrets.DEPLOYMENT_ROLE }}
          aws-region: eu-west-2

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          codeartifact-account: ${{ secrets.CODEARTIFACT_ACCOUNT }}

      - name: Run semantic release
        id: release
        run: pnpm run semantic:release
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Release Outputs
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TYPE: ${{ steps.release.outputs.type }}
        run: |
          echo "The next version is ${VERSION}"
          echo "The release type is ${TYPE}"
